<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Play a quick, free game of Tic-Tac-Toe with a friend."
    />
    <meta name="theme-color" content="#f5f3ed" />
    <title>Tic-Tac-Toe — Web Laro!!</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="Web Laro!! home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Web Laro!!</span>
      </a>
      <a class="back-link" href="../index.html#games"><span aria-hidden="true">←</span> All games</a>
    </header>

    <main class="game-page">
      <section class="game-panel" aria-labelledby="game-title">
        <p class="eyebrow"><span aria-hidden="true">✦</span> A classic little game</p>
        <h1 id="game-title">Tic-Tac-Toe</h1>
        <p class="intro">Take turns, make your mark, and get three in a row.</p>

        <div class="scoreboard" aria-label="Round score">
          <div class="score-card score-x" id="score-card-x">
            <span class="score-mark" aria-hidden="true">X</span>
            <span class="player-name">Player X</span>
            <span class="score-value" id="score-x">0</span>
          </div>
          <div class="score-card score-draw">
            <span class="score-mark" aria-hidden="true">＝</span>
            <span class="player-name">Draws</span>
            <span class="score-value" id="score-draw">0</span>
          </div>
          <div class="score-card score-o" id="score-card-o">
            <span class="score-mark" aria-hidden="true">O</span>
            <span class="player-name">Player O</span>
            <span class="score-value" id="score-o">0</span>
          </div>
        </div>

        <p class="game-status" id="game-status" role="status" aria-live="polite">
          Player X's turn
        </p>

        <div class="board" role="group" aria-label="Tic-Tac-Toe board">
          <button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1, empty"></button>
          <button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2, empty"></button>
          <button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3, empty"></button>
          <button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1, empty"></button>
          <button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2, empty"></button>
          <button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3, empty"></button>
          <button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1, empty"></button>
          <button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2, empty"></button>
          <button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3, empty"></button>
        </div>

        <button class="reset-button" id="new-round" type="button">New round <span aria-hidden="true">↻</span></button>
        <p class="game-hint">Two players · Same screen · Take turns</p>
      </section>
    </main>

    <footer class="footer">
      <span>© 2026 Web Laro!!</span>
      <a href="../index.html#games">More little games <span aria-hidden="true">→</span></a>
    </footer>
  </body>
</html>
